name: Bank ready wave-200 shards

on:
  push:
    branches:
      - codex/wave-300-continuation-20260820
    paths:
      - .github/workflows/bank-wave200-ready.yml

permissions:
  contents: write

jobs:
  bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Create narrow rolling checkpoints
        shell: python
        run: |
          import json
          import re
          import subprocess
          from pathlib import Path

          report = json.loads(Path("state/audit_wave200_20260821.json").read_text(encoding="utf-8"))
          source_shards = [7, 8, 9, 10, 11, *range(14, 27)]
          rolling = dict(zip(source_shards, range(78, 96)))

          def run(*args):
              subprocess.run(args, check=True)

          def format_exclusions(row):
              parts = []
              for start, end in row.get("canonical_ranges", []):
                  parts.append(str(start) if start == end else f"{start}-{end}")
              parts.extend(str(index) for index in row.get("canonical_indexes", []))
              return ", ".join(parts)

          for source_shard in source_shards:
              shard = report["shards"][str(source_shard)]
              if not shard["ready"]:
                  raise SystemExit(f"wave-200 shard {source_shard} is not audit-ready")
              rolling_shard = rolling[source_shard]
              path = Path(f"state/checkpoint_250campaign_shard{rolling_shard}.md")
              if path.exists():
                  raise SystemExit(f"Refusing to overwrite existing checkpoint {path}")

              banked = sum(row["status"] == "BANKED" for row in shard["scenes"])
              excluded = sum(row["status"] == "FULLY_EXCLUDED" for row in shard["scenes"])
              rows = sum(row.get("translation_rows", 0) for row in shard["scenes"])
              lines = [
                  f"# Rolling completion checkpoint {rolling_shard}",
                  "",
                  f"Source ledger: wave-200 shard {source_shard} (`{shard['claim']}`)",
                  f"Status: DONE ({banked} BANKED, {excluded} FULLY EXCLUDED)",
                  "",
                  "Scenes:",
              ]
              for row in shard["scenes"]:
                  ranges = format_exclusions(row)
                  if row["status"] == "BANKED":
                      suffix = f"; canonical exclusions {ranges} remain absent" if ranges else "; no restricted range"
                      lines.append(
                          f"- {row['scene']} — {row['translation_rows']} permitted rows banked + accuracy/literary QC{suffix}"
                      )
                  elif row["status"] == "FULLY_EXCLUDED":
                      lines.append(
                          f"- {row['scene']} — fully excluded by canonical ranges {ranges}; no translation or QC payload exists"
                      )
                  else:
                      raise SystemExit(f"Unexpected status in ready shard: {row}")
              lines += [
                  "",
                  "Validation:",
                  f"- exact banked row total: {rows}",
                  "- both QC lenses are present and verified for every banked scene",
                  "- duplicate-free JSON, complete known index coverage, CP932 encoding, and zero translation/exclusion overlap pass",
                  "- all canonical exclusions remain absent, unbridged, and unsummarized",
                  "- no completed scene was retranslated",
                  "",
              ]
              next_rolling = rolling_shard + 1 if rolling_shard < 95 else 96
              lines.append(f"Next rolling checkpoint: {next_rolling}.")
              lines.append("")
              path.write_text("\n".join(lines), encoding="utf-8")
              run("git", "add", str(path))
              run(
                  "git",
                  "commit",
                  "-m",
                  f"Checkpoint Tsuyokiss rolling shard {rolling_shard} (wave200 shard {source_shard})",
              )

          ledger_path = Path("state/wave_200_continuation_20260820.md")
          ledger = ledger_path.read_text(encoding="utf-8")
          ledger = ledger.replace(
              "- Status: FIRED 2026-08-20T19:42:00Z",
              "- Status: IN PROGRESS 2026-08-21 (24/52 shards structurally closed; 28 open)",
          )
          ready_all = list(range(1, 12)) + list(range(14, 27))
          for source_shard in ready_all:
              shard = report["shards"][str(source_shard)]
              banked = sum(row["status"] == "BANKED" for row in shard["scenes"])
              excluded = sum(row["status"] == "FULLY_EXCLUDED" for row in shard["scenes"])
              label = f"DONE ({banked} BANKED, {excluded} FULLY EXCLUDED)"
              pattern = rf"^\| {source_shard} \| (?:RECOVERY|CLAIMED) \|"
              ledger, count = re.subn(pattern, f"| {source_shard} | {label} |", ledger, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Expected one open ledger row for shard {source_shard}, found {count}")
          ledger_path.write_text(ledger, encoding="utf-8")

      - name: Commit ledger and remove one-shot workflow
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          rm .github/workflows/bank-wave200-ready.yml
          git add state/wave_200_continuation_20260820.md .github/workflows/bank-wave200-ready.yml
          git commit -m "Advance wave-200 ledger to 24 of 52"
          git push origin "HEAD:${{ github.ref_name }}"
