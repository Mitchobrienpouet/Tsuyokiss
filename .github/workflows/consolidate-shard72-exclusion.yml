name: Consolidate shard 72 exclusion

on:
  push:
    branches:
      - codex/wave-300-continuation-20260820
    paths:
      - .github/workflows/consolidate-shard72-exclusion.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Append the canonical exclusion
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("content_exclusions.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          scene = "SC_G0390_00_G0400_00"
          entry = {
              "scene": scene,
              "ranges": [[1, 2]],
              "reason": (
                  "Connected explicit sexual self-stimulation aftermath involving a "
                  "high-school student; fully excluded from model work and builds by policy."
              ),
          }

          matches = [item for item in data["entries"] if item.get("scene") == scene]
          if matches:
              if matches != [entry]:
                  raise SystemExit(f"Conflicting canonical entry already exists for {scene}: {matches!r}")
          else:
              data["entries"].append(entry)

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Remove the one-shot bootstrap workflow
        run: rm .github/workflows/consolidate-shard72-exclusion.yml

      - name: Commit the canonical boundary
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add content_exclusions.json .github/workflows/consolidate-shard72-exclusion.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Consolidate shard 72 exclusion boundary"
          git push origin "HEAD:${{ github.ref_name }}"
