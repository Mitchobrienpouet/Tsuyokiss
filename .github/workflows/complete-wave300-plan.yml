name: Complete wave-300 plan ledger

on:
  push:
    branches:
      - codex/wave-300-continuation-20260820
    paths:
      - .github/workflows/complete-wave300-plan.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Mark terminal shards complete
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("state/wave_300_plan.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "- Status: FIRED 2026-08-20T09:06:06Z",
              "- Status: COMPLETE 2026-08-21 (77/77 shards DONE)",
          )
          labels = {
              72: "DONE (3 TRANSLATED, 1 FULLY EXCLUDED)",
              73: "DONE (2 TRANSLATED, 2 FULLY EXCLUDED)",
              74: "DONE",
              75: "DONE (3 TRANSLATED, 1 FULLY EXCLUDED)",
              76: "DONE",
              77: "DONE (2 TRANSLATED, 1 FULLY EXCLUDED; TERMINAL)",
          }
          for shard, status in labels.items():
              pattern = rf"^\| {shard} \| CLAIMED \|"
              replacement = f"| {shard} | {status} |"
              text, count = re.subn(pattern, replacement, text, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Expected one CLAIMED row for shard {shard}, found {count}")
          if "77/77 shards DONE" not in text:
              raise SystemExit("Completion marker was not written")
          path.write_text(text, encoding="utf-8")

      - name: Remove one-shot workflow
        run: rm .github/workflows/complete-wave300-plan.yml

      - name: Commit ledger completion
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add state/wave_300_plan.md .github/workflows/complete-wave300-plan.yml
          git commit -m "Complete wave-300 plan ledger"
          git push origin "HEAD:${{ github.ref_name }}"
