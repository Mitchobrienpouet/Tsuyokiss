name: Consolidate wave-200 exclusion overlay

on:
  push:
    branches:
      - codex/wave-300-continuation-20260820
    paths:
      - .github/workflows/consolidate-wave200-overlay.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Consolidate overlay into canonical manifest
        shell: python
        run: |
          import json
          from pathlib import Path

          base_path = Path("content_exclusions.json")
          overlay_path = Path("state/content_exclusions_wave200_overlay.json")
          base = json.loads(base_path.read_text(encoding="utf-8"))
          overlay = json.loads(overlay_path.read_text(encoding="utf-8"))

          by_scene = {entry["scene"]: entry for entry in base["entries"]}
          added = []
          for entry in overlay["entries"]:
              scene = entry["scene"]
              existing = by_scene.get(scene)
              if existing is None:
                  base["entries"].append(entry)
                  by_scene[scene] = entry
                  added.append(scene)
              elif existing != entry:
                  raise SystemExit(
                      f"Conflicting canonical exclusion for {scene}:\n"
                      f"canonical={existing!r}\noverlay={entry!r}"
                  )

          base_path.write_text(
              json.dumps(base, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          overlay["status"] = "CONSOLIDATED"
          overlay["consolidated_into"] = "content_exclusions.json"
          overlay["new_entries_added"] = added
          overlay["policy"] = (
              "Historical record of fail-closed findings consolidated into the canonical "
              "manifest; do not apply this file as a second active overlay."
          )
          overlay_path.write_text(
              json.dumps(overlay, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

      - name: Remove one-shot workflow
        run: rm .github/workflows/consolidate-wave200-overlay.yml

      - name: Commit consolidation
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add content_exclusions.json state/content_exclusions_wave200_overlay.json .github/workflows/consolidate-wave200-overlay.yml
          git commit -m "Consolidate wave-200 exclusion overlay"
          git push origin "HEAD:${{ github.ref_name }}"
