name: Close wave-200 shard 27

on:
  push:
    branches:
      - codex/wave-300-continuation-20260820
    paths:
      - .github/workflows/close-wave200-shard27.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure author
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"

      - name: Revalidate shard 27 and repair audit
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          scenes = [
              "SC_M0290_00_M0291_00",
              "SC_M0291_00_M0300_00",
              "SC_M0300_00_M0301_00",
              "SC_M0301_00_M0310_00",
          ]
          report_path = Path("state/audit_wave200_20260821.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          exclusions = json.loads(Path("content_exclusions.json").read_text(encoding="utf-8"))["entries"]
          exclusion_map = {entry["scene"]: entry for entry in exclusions}

          def expand(entry):
              values = set()
              if entry:
                  for start, end in entry.get("ranges", []):
                      values.update(range(int(start), int(end) + 1))
                  values.update(int(index) for index in entry.get("indexes", []))
              return values

          def load_no_duplicates(path):
              def hook(pairs):
                  out = {}
                  for key, value in pairs:
                      if key in out:
                          raise ValueError(f"duplicate JSON key {key!r} in {path}")
                      out[key] = value
                  return out
              return json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=hook)

          explicit_fail = re.compile(
              r"(?im)^\s*(?:#{1,6}\s*)?(?:[-*]\s*)?"
              r"(?:verdict|status|result|overall(?:\s+verdict)?)\s*[:=\-]\s*FAIL\b"
          )
          accuracy_pass = re.compile(
              r"(?im)(?:^\s*PASS\b|^\s*(?:#{1,6}\s*)?(?:[-*]\s*)?"
              r"(?:verdict|status|result|overall(?:\s+verdict)?)\s*[:=\-]\s*PASS\b)"
          )

          rows = []
          for scene in scenes:
              tpath = Path("translations") / f"{scene}.json"
              apath = Path("qc/accuracy") / f"{scene}.md"
              lpath = Path("qc/literary") / f"{scene}.md"
              if not (tpath.exists() and apath.exists() and lpath.exists()):
                  raise SystemExit(f"Shard 27 artifact missing for {scene}")
              payload = load_no_duplicates(tpath)
              if payload.get("file") != scene:
                  raise SystemExit(f"Identity mismatch for {scene}: {payload.get('file')!r}")
              lines = payload.get("lines")
              if not isinstance(lines, dict) or not lines:
                  raise SystemExit(f"Empty translation payload for {scene}")
              keys = {int(key) for key in lines}
              exclusion = exclusion_map.get(scene)
              excluded = expand(exclusion)
              overlap = sorted(keys & excluded)
              if overlap:
                  raise SystemExit(f"Excluded indexes leaked into {scene}: {overlap}")
              upper = max(keys | excluded)
              uncovered = sorted(set(range(1, upper + 1)) - keys - excluded)
              if uncovered:
                  raise SystemExit(f"Unregistered gaps in {scene}: {uncovered}")
              accuracy = apath.read_text(encoding="utf-8")
              literary = lpath.read_text(encoding="utf-8")
              if not accuracy_pass.search(accuracy) or explicit_fail.search(accuracy):
                  raise SystemExit(f"Accuracy verdict invalid for {scene}")
              if not literary.strip() or explicit_fail.search(literary):
                  raise SystemExit(f"Literary verdict invalid for {scene}")
              for value in payload.get("speaker_map", {}).values():
                  str(value).encode("cp932")
              for value in lines.values():
                  str(value).encode("cp932")
              rows.append({
                  "scene": scene,
                  "translation": True,
                  "accuracy_qc": True,
                  "literary_qc": True,
                  "canonical_exclusion": bool(exclusion),
                  "canonical_ranges": exclusion.get("ranges", []) if exclusion else [],
                  "canonical_indexes": exclusion.get("indexes", []) if exclusion else [],
                  "status": "BANKED",
                  "translation_rows": len(keys),
                  "known_source_span": upper,
                  "excluded_index_count": len(excluded),
                  "json_duplicate_keys": "PASS",
                  "known_index_coverage": "PASS",
                  "exclusion_overlap": "PASS",
                  "cp932": "PASS",
                  "accuracy_verdict": "PASS",
                  "literary_verdict": "verified",
              })

          report["shards"]["27"]["ready"] = True
          report["shards"]["27"]["scenes"] = rows
          report["actionable_gaps"] = [
              gap for gap in report.get("actionable_gaps", [])
              if not (int(gap.get("shard", -1)) == 27 and gap.get("scene") in scenes)
          ]

          totals = {
              "scenes": 0,
              "banked": 0,
              "fully_excluded": 0,
              "ambiguous_exclusion_only": 0,
              "missing": 0,
              "invalid": 0,
              "translation_rows": 0,
              "ready_shards": 0,
          }
          for shard in report["shards"].values():
              if shard.get("ready"):
                  totals["ready_shards"] += 1
              for row in shard["scenes"]:
                  totals["scenes"] += 1
                  status = row["status"]
                  if status == "BANKED":
                      totals["banked"] += 1
                      totals["translation_rows"] += int(row.get("translation_rows", 0))
                  elif status == "FULLY_EXCLUDED":
                      totals["fully_excluded"] += 1
                  elif status == "AMBIGUOUS_EXCLUSION_ONLY":
                      totals["ambiguous_exclusion_only"] += 1
                  elif status == "MISSING":
                      totals["missing"] += 1
                  elif status == "INVALID":
                      totals["invalid"] += 1
          report["totals"] = totals
          report["audit_revision"] = (
              "2026-08-21: explicit verdict parsing replaces lexical FAIL scanning; "
              "ordinary prose such as 'fail to persuade' no longer triggers a false invalid result."
          )
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          md = [
              "# Wave-200 completion audit — 2026-08-21",
              "",
              "This audit checks all 52 ledger shards against banked translations, both QC lenses, canonical exclusions, exact known index coverage, exclusion disjointness, duplicate-free JSON, and CP932 encodability.",
              "",
              "> Revision: explicit verdict parsing is used. Ordinary prose containing words such as `fail` is not treated as a QC failure.",
              "",
              "## Totals",
              "",
              f"- Ledger scenes: {totals['scenes']}",
              f"- Banked scenes: {totals['banked']}",
              f"- Fully excluded scenes: {totals['fully_excluded']}",
              f"- Ambiguous exclusion-only scenes: {totals['ambiguous_exclusion_only']}",
              f"- Missing scenes: {totals['missing']}",
              f"- Invalid scenes: {totals['invalid']}",
              f"- Banked translation rows: {totals['translation_rows']}",
              f"- Ready shards: {totals['ready_shards']}/52",
              "",
              "## Shards",
              "",
              "| Shard | Ready | Banked | Fully excluded | Ambiguous | Missing/invalid |",
              "|---:|---:|---:|---:|---:|---:|",
          ]
          for number in range(1, 53):
              shard = report["shards"][str(number)]
              statuses = [row["status"] for row in shard["scenes"]]
              md.append(
                  f"| {number} | {'yes' if shard['ready'] else 'NO'} | {statuses.count('BANKED')} | "
                  f"{statuses.count('FULLY_EXCLUDED')} | {statuses.count('AMBIGUOUS_EXCLUSION_ONLY')} | "
                  f"{statuses.count('MISSING') + statuses.count('INVALID')} |"
              )
          md += ["", "## Actionable gaps", ""]
          if report["actionable_gaps"]:
              for gap in report["actionable_gaps"]:
                  md.append(f"- Shard {gap['shard']} `{gap['scene']}` — {gap['problem']}")
          else:
              md.append("- none")
          md += ["", "## Ambiguous exclusion-only scenes", ""]
          if report.get("ambiguous_exclusions"):
              for gap in report["ambiguous_exclusions"]:
                  md.append(f"- Shard {gap['shard']} `{gap['scene']}` — evidence: {', '.join(gap.get('evidence', [])) or 'none'}")
          else:
              md.append("- none")
          md.append("")
          Path("state/audit_wave200_20260821.md").write_text("\n".join(md), encoding="utf-8")

          checkpoint = Path("state/checkpoint_250campaign_shard96.md")
          if checkpoint.exists():
              raise SystemExit("Refusing to overwrite existing checkpoint 96")
          checkpoint_lines = [
              "# Rolling completion checkpoint 96",
              "",
              "Source ledger: wave-200 shard 27 (`w200-27`)",
              "Status: DONE (4 BANKED, 0 FULLY EXCLUDED)",
              "",
              "Scenes:",
          ]
          for row in rows:
              checkpoint_lines.append(
                  f"- {row['scene']} — {row['translation_rows']} permitted rows banked + accuracy/literary QC"
              )
          checkpoint_lines += [
              "",
              "Validation:",
              f"- exact banked row total: {sum(row['translation_rows'] for row in rows)}",
              "- both QC lenses are present and verified for every scene",
              "- duplicate-free JSON, complete known index coverage, CP932 encoding, and zero translation/exclusion overlap pass",
              "- the previous shard-level invalid result was a lexical false positive in literary prose, not a QC failure",
              "- no completed scene was retranslated",
              "",
              "Next rolling checkpoint: 97.",
              "",
          ]
          checkpoint.write_text("\n".join(checkpoint_lines), encoding="utf-8")

          ledger_path = Path("state/wave_200_continuation_20260820.md")
          ledger = ledger_path.read_text(encoding="utf-8")
          ledger = ledger.replace(
              "- Status: IN PROGRESS 2026-08-21 (24/52 shards structurally closed; 28 open)",
              "- Status: IN PROGRESS 2026-08-21 (25/52 shards structurally closed; 27 open)",
          )
          ledger, count = re.subn(
              r"^\| 27 \| CLAIMED \|",
              "| 27 | DONE (4 BANKED, 0 FULLY EXCLUDED) |",
              ledger,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"Expected one CLAIMED row for shard 27, found {count}")
          ledger_path.write_text(ledger, encoding="utf-8")

      - name: Commit repaired audit
        run: |
          git add state/audit_wave200_20260821.json state/audit_wave200_20260821.md
          git commit -m "Correct wave-200 shard 27 audit verdict parsing"

      - name: Commit rolling checkpoint 96
        run: |
          git add state/checkpoint_250campaign_shard96.md
          git commit -m "Checkpoint Tsuyokiss rolling shard 96 (wave200 shard 27)"

      - name: Commit ledger and remove workflow
        run: |
          rm .github/workflows/close-wave200-shard27.yml
          git add state/wave_200_continuation_20260820.md .github/workflows/close-wave200-shard27.yml
          git commit -m "Advance wave-200 ledger to 25 of 52"
          git push origin "HEAD:${{ github.ref_name }}"
