name: Recover wave-200 sources from Git history

on:
  push:
    branches:
      - codex/wave-300-continuation-20260820
    paths:
      - .github/workflows/recover-wave200-source-history.yml

permissions:
  contents: write
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          lfs: true

      - name: Scan every reachable Git blob for recovered retail sources
        shell: python
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          work = root / "history-recovery-artifact"
          work.mkdir(exist_ok=True)
          manifest = json.loads((root / "state/wave200_remaining_source_manifest.json").read_text(encoding="utf-8"))
          target_scenes = [scene for shard in manifest["shards"] for scene in shard["scenes"]]
          target_scenes += [
              "SC_J0100_16_J0100_20",
              "SC_J0100_17_J0100_20",
              "SC_J0100_18_J0100_20",
              "SC_J0100_20_Z9999_99",
              "SC_M0310_00_M0320_00",
              "SC_M0320_00_M0330_00",
              "SC_M0330_10_M0340_00",
              "SC_M0330_20_M0340_00",
          ]
          needles = [scene.encode("ascii") for scene in target_scenes]

          objects = subprocess.check_output(
              ["git", "rev-list", "--objects", "--all"], text=True, errors="replace"
          ).splitlines()
          paths_by_sha = {}
          ordered = []
          for line in objects:
              sha, *rest = line.split(" ", 1)
              if sha not in paths_by_sha:
                  paths_by_sha[sha] = []
                  ordered.append(sha)
              if rest:
                  paths_by_sha[sha].append(rest[0])

          batch_input = "".join(f"{sha}\n" for sha in ordered).encode()
          checked = subprocess.check_output(
              ["git", "cat-file", "--batch-check=%(objectname) %(objecttype) %(objectsize)"],
              input=batch_input,
          ).decode().splitlines()
          metadata = {}
          for line in checked:
              parts = line.split()
              if len(parts) == 3 and parts[1] == "blob":
                  metadata[parts[0]] = int(parts[2])

          candidates = []
          inspected = 0
          for sha in ordered:
              size = metadata.get(sha)
              if size is None or size > 80_000_000:
                  continue
              names = paths_by_sha.get(sha, [])
              lowered = " ".join(names).lower()
              likely_name = any(token in lowered for token in (
                  "translation_template", "project_source", "game_extract", "game_media",
                  "data_blocks", "jp_dump", "model_source", "preflight", "source", ".jsonl",
                  "data.fpk", ".zip", ".001", ".002", ".003", ".004", ".005", ".006", ".007", ".008"
              ))
              if not likely_name and size > 12_000_000:
                  continue
              try:
                  data = subprocess.check_output(["git", "cat-file", "blob", sha])
              except subprocess.CalledProcessError:
                  continue
              inspected += 1
              matches = [target_scenes[i] for i, needle in enumerate(needles) if needle in data]
              has_source_schema = all(token in data[:2_000_000] for token in (
                  b'"scene"', b'"source"', b'"source_sha256"'
              ))
              binary_signature = (
                  "zip" if data.startswith(b"PK\x03\x04") else
                  "fpk" if b"ZLC2" in data[:1_000_000] else
                  None
              )
              if matches or (likely_name and (has_source_schema or binary_signature)):
                  candidates.append({
                      "sha": sha,
                      "size": size,
                      "paths": names[:20],
                      "match_count": len(matches),
                      "matches": matches,
                      "source_schema": has_source_schema,
                      "binary_signature": binary_signature,
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })

          candidates.sort(key=lambda row: (
              row["match_count"], row["source_schema"], row["binary_signature"] is not None, row["size"]
          ), reverse=True)

          exported = []
          for rank, row in enumerate(candidates[:12], 1):
              data = subprocess.check_output(["git", "cat-file", "blob", row["sha"]])
              suffix = ".jsonl" if row["source_schema"] else (".zip" if row["binary_signature"] == "zip" else ".bin")
              path = work / f"candidate_{rank:02d}_{row['sha'][:12]}{suffix}"
              path.write_bytes(data)
              exported.append({**row, "artifact_path": path.name})

          extraction = {"attempted": False, "success": False}
          jsonl_candidates = [row for row in exported if row["source_schema"] and row["match_count"]]
          if jsonl_candidates:
              best = work / jsonl_candidates[0]["artifact_path"]
              raw_dir = work / "jp_dumps"
              model_dir = work / "model_sources"
              report_path = work / "wave200_remaining_extraction_report.json"
              cmd = [
                  "python", "tools/translation/extract_wave200_remaining_sources.py",
                  "--repo", str(root),
                  "--messages", str(best),
                  "--raw-output", str(raw_dir),
                  "--model-output", str(model_dir),
                  "--report", str(report_path),
              ]
              extraction["attempted"] = True
              completed = subprocess.run(cmd, text=True, capture_output=True)
              extraction.update({
                  "success": completed.returncode == 0,
                  "returncode": completed.returncode,
                  "stdout": completed.stdout[-4000:],
                  "stderr": completed.stderr[-4000:],
                  "candidate": jsonl_candidates[0]["artifact_path"],
              })

          report = {
              "schema_version": 1,
              "branch": os.environ["REF_NAME"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "artifact_name": f"tsuyokiss-wave200-history-source-{os.environ['RUN_ID']}",
              "reachable_objects": len(ordered),
              "inspected_blobs": inspected,
              "target_scene_count": len(target_scenes),
              "candidate_count": len(candidates),
              "exported_candidates": exported,
              "extraction": extraction,
          }
          (work / "history_source_recovery_report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          (root / "state/history_source_recovery_20260821.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

      - name: Upload recovered source package outside Git history
        uses: actions/upload-artifact@v4
        with:
          name: tsuyokiss-wave200-history-source-${{ github.run_id }}
          path: history-recovery-artifact
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Publish recovery locator and remove one-shot workflow
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          rm .github/workflows/recover-wave200-source-history.yml
          git add state/history_source_recovery_20260821.json .github/workflows/recover-wave200-source-history.yml
          git commit -m "Publish wave-200 historical source recovery locator"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
