name: Restore missing wave-200 translation artifacts from Git history

on:
  push:
    branches:
      - codex/wave-300-continuation-20260820
    paths:
      - .github/workflows/restore-wave200-artifacts-from-history.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore reachable historical translation and QC artifacts
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          manifest = json.loads((root / "state/wave200_remaining_source_manifest.json").read_text(encoding="utf-8"))
          scenes = [scene for shard in manifest["shards"] for scene in shard["scenes"]]
          scenes = [
              "SC_M0310_00_M0320_00",
              "SC_M0320_00_M0330_00",
              "SC_M0330_10_M0340_00",
              "SC_M0330_20_M0340_00",
          ] + scenes

          restored = []
          unresolved = []
          already_present = []

          def latest_historical_bytes(path: str):
              result = subprocess.run(
                  ["git", "log", "--all", "--full-history", "--format=%H", "--", path],
                  text=True, capture_output=True, check=True,
              )
              for commit in result.stdout.splitlines():
                  shown = subprocess.run(
                      ["git", "show", f"{commit}:{path}"], capture_output=True,
                  )
                  if shown.returncode == 0 and shown.stdout:
                      return commit, shown.stdout
              return None, None

          for scene in scenes:
              for kind, path in (
                  ("translation", f"translations/{scene}.json"),
                  ("accuracy_qc", f"qc/accuracy/{scene}.md"),
                  ("literary_qc", f"qc/literary/{scene}.md"),
              ):
                  destination = root / path
                  if destination.exists():
                      already_present.append({"scene": scene, "kind": kind, "path": path})
                      continue
                  commit, data = latest_historical_bytes(path)
                  if data is None:
                      unresolved.append({"scene": scene, "kind": kind, "path": path})
                      continue
                  if kind == "translation":
                      try:
                          payload = json.loads(data.decode("utf-8"))
                      except Exception as exc:
                          raise SystemExit(f"Historical translation is invalid JSON: {path}: {exc}")
                      if payload.get("file") != scene or not isinstance(payload.get("lines"), dict):
                          raise SystemExit(f"Historical translation identity/shape mismatch: {path}")
                  else:
                      if not data.decode("utf-8").strip():
                          raise SystemExit(f"Historical QC is empty: {path}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  restored.append({
                      "scene": scene,
                      "kind": kind,
                      "path": path,
                      "source_commit": commit,
                      "bytes": len(data),
                  })

          report = {
              "schema_version": 1,
              "target_scene_count": len(scenes),
              "artifact_slots": len(scenes) * 3,
              "already_present_count": len(already_present),
              "restored_count": len(restored),
              "unresolved_count": len(unresolved),
              "restored": restored,
              "unresolved": unresolved,
          }
          Path("state/history_artifact_restore_20260821.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

      - name: Commit recovered artifacts and remove one-shot workflow
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          rm .github/workflows/restore-wave200-artifacts-from-history.yml
          git add translations qc state/history_artifact_restore_20260821.json .github/workflows/restore-wave200-artifacts-from-history.yml
          git commit -m "Restore reachable wave-200 artifacts from history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
