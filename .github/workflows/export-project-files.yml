name: Export Tsuyokiss project files

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact project commit
        uses: actions/checkout@v4
        with:
          ref: 67ec4d4f63c3d60fb5175a30305b117b563f8b41
          fetch-depth: 1

      - name: Build reproducible project archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          archive="export/Tsuyokiss-project-67ec4d4.zip"
          git archive \
            --format=zip \
            --prefix="Tsuyokiss-project-67ec4d4/" \
            --output="$archive" \
            HEAD
          sha256sum "$archive" > "${archive}.sha256"
          {
            echo "repository=Mitchobrienpouet/Tsuyokiss"
            echo "branch=codex/wave-300-continuation-20260820"
            echo "commit=$(git rev-parse HEAD)"
          } > export/PROJECT_VERSION.txt

      - name: Upload project package
        uses: actions/upload-artifact@v4
        with:
          name: Tsuyokiss-project-files-67ec4d4
          path: export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
