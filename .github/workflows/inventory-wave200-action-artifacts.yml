name: Inventory Tsuyokiss Actions artifacts

on:
  push:
    branches:
      - codex/wave-300-continuation-20260820
    paths:
      - .github/workflows/inventory-wave200-action-artifacts.yml

permissions:
  contents: write
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Inventory workflow runs and retained artifacts
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "tsuyokiss-project-closeout",
          }

          def get(path):
              request = urllib.request.Request(f"https://api.github.com{path}", headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          runs = []
          page = 1
          while page <= 10:
              payload = get(f"/repos/{repo}/actions/runs?per_page=100&page={page}")
              batch = payload.get("workflow_runs", [])
              if not batch:
                  break
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          entries = []
          for run in runs:
              run_id = int(run["id"])
              artifacts = get(f"/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
              entries.append({
                  "run_id": run_id,
                  "name": run.get("name"),
                  "display_title": run.get("display_title"),
                  "event": run.get("event"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_branch": run.get("head_branch"),
                  "head_sha": run.get("head_sha"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
                  "artifacts": [{
                      "id": int(artifact["id"]),
                      "name": artifact.get("name"),
                      "size_in_bytes": int(artifact.get("size_in_bytes", 0)),
                      "expired": bool(artifact.get("expired")),
                      "created_at": artifact.get("created_at"),
                      "expires_at": artifact.get("expires_at"),
                  } for artifact in artifacts],
              })

          retained = [
              {"run_id": row["run_id"], "workflow": row["name"], **artifact}
              for row in entries for artifact in row["artifacts"] if not artifact["expired"]
          ]
          report = {
              "schema_version": 1,
              "repository": repo,
              "branch": os.environ["REF_NAME"],
              "inventory_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_count": len(entries),
              "retained_artifact_count": len(retained),
              "retained_artifacts": retained,
              "runs": entries,
          }
          Path("state/actions_artifact_inventory_20260821.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

      - name: Publish inventory and remove one-shot workflow
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          rm .github/workflows/inventory-wave200-action-artifacts.yml
          git add state/actions_artifact_inventory_20260821.json .github/workflows/inventory-wave200-action-artifacts.yml
          git commit -m "Inventory retained Tsuyokiss Actions artifacts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
